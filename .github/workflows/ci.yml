name: CI

on:
  push:
  pull_request:

jobs:
  audit-log:
    name: Audit log core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the Apps Script copy of the core is in sync
        run: npm run sync:check

      - name: Run unit tests
        run: npm test
